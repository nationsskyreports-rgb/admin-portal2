<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="../logo.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOS Admin — Call Log Settings</title>
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ── Page-specific styles ── */
.settings-tabs {
  display: flex;
  gap: 2px;
  background: var(--surface2);
  border-radius: var(--r-md);
  padding: 3px;
  margin-bottom: 20px;
}
.settings-tab {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 16px;
  border: none;
  border-radius: var(--r-sm);
  background: transparent;
  color: var(--muted);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: 'Inter', sans-serif;
}
.settings-tab:hover:not(.active) { color: var(--text-dim); background: var(--surface3); }
.settings-tab.active { background: var(--accent-grad); color: #fff; }
.settings-tab .tab-count {
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 10px;
  font-weight: 700;
  line-height: 1.4;
}
.settings-tab.active .tab-count { background: rgba(255,255,255,0.2); color: #fff; }
.settings-tab:not(.active) .tab-count { background: var(--surface3); color: var(--muted); }

.settings-section { display: none; animation: fadeUp 0.2s ease; }
.settings-section.active { display: block; }

/* Add-bar */
.add-bar {
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 12px 16px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  margin-bottom: 16px;
}
.add-bar input, .add-bar select {
  padding: 9px 14px;
  border-radius: var(--r-md);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 13px;
  font-family: 'Inter', sans-serif;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.add-bar input:focus, .add-bar select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(79, 138, 249, 0.08);
}
.add-bar input { flex: 1; min-width: 0; }
.add-bar select { width: 120px; flex-shrink: 0; }

/* Item list */
.item-list { border-radius: var(--r-lg); overflow: hidden; border: 1px solid var(--border); }
.item-list:empty { border: none; }

.item-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 16px;
  border-bottom: 1px solid var(--border);
  transition: background 0.15s;
  background: var(--surface);
}
.item-row:last-child { border-bottom: none; }
.item-row:hover { background: var(--surface2); }
.item-row.inactive { opacity: 0.45; }

.item-type-badge {
  font-size: 10px;
  padding: 3px 10px;
  border-radius: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  flex-shrink: 0;
}
.type-project { background: rgba(79,138,249,0.1); color: var(--accent); border: 1px solid rgba(79,138,249,0.2); }
.type-other   { background: rgba(139,92,246,0.1); color: #8B5CF6; border: 1px solid rgba(139,92,246,0.2); }

.item-name { flex: 1; font-weight: 600; font-size: 13px; color: var(--text); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.item-actions {
  display: flex;
  gap: 4px;
  flex-shrink: 0;
  opacity: 0.5;
  transition: opacity 0.15s;
}
.item-row:hover .item-actions { opacity: 1; }

.action-btn {
  width: 30px;
  height: 30px;
  border: 1px solid var(--border);
  background: var(--surface2);
  border-radius: var(--r-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 12px;
  transition: all 0.15s;
  color: var(--muted);
}
.action-btn:hover { border-color: var(--border2); color: var(--accent); background: var(--surface3); }
.action-btn.danger:hover { color: var(--danger); border-color: rgba(240,82,82,0.3); }
.action-btn.toggle-on { color: var(--success); }
.action-btn.toggle-off { color: var(--danger); opacity: 0.8; }

/* Section count chip */
.section-count {
  font-size: 11px;
  color: var(--muted);
  font-weight: 600;
  padding: 4px 0;
}

/* Cat2 parent picker */
.parent-picker {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  margin-bottom: 16px;
}
.parent-picker-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--accent);
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
}
.parent-picker select {
  flex: 1;
  padding: 9px 14px;
  border-radius: var(--r-md);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 13px;
  font-family: 'Inter', sans-serif;
  outline: none;
  transition: border-color 0.15s;
}
.parent-picker select:focus { border-color: var(--accent); }

/* Bulk + Pick panels */
.expand-panel {
  padding: 16px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  margin-bottom: 16px;
  animation: fadeUp 0.2s ease;
}
.expand-panel-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-bottom: 10px;
}
.pick-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border-radius: var(--r-sm);
  cursor: pointer;
  font-size: 13px;
  border-bottom: 1px solid var(--border);
  transition: background 0.1s;
}
.pick-item:last-child { border-bottom: none; }
.pick-item:hover { background: rgba(79,138,249,0.04); }
.pick-name { flex: 1; font-weight: 600; color: var(--text); }
.pick-parents { font-size: 10px; color: var(--muted); text-align: right; }
</style>
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-content">

    <div class="topbar">
      <div class="topbar-left">
        <div class="page-title">Call Log Settings</div>
        <div class="breadcrumb"><i class="fas fa-circle" style="font-size:5px;color:var(--gold)"></i> Projects & Categories</div>
      </div>
      <div class="topbar-right">
        <button class="topbar-btn" onclick="refreshAll()" title="Refresh"><i class="fas fa-sync-alt"></i></button>
        <button class="theme-toggle" id="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Theme"><i class="fas fa-moon"></i></button>
        <div class="admin-chip">
          <div class="admin-avatar" id="admin-avatar">A</div>
          <span class="admin-name" id="admin-name">Admin</span>
        </div>
      </div>
    </div>

    <div class="page-content">
      <div class="section-card">
        <div class="section-body">

          <!-- ═══ TABS ═══ -->
          <div class="settings-tabs">
            <button class="settings-tab active" onclick="switchTab('choose')">
              <i class="fas fa-list-ul"></i> Choose Options
              <span class="tab-count" id="count-choose">0</span>
            </button>
            <button class="settings-tab" onclick="switchTab('cat1')">
              <i class="fas fa-folder"></i> Category 1
              <span class="tab-count" id="count-cat1">0</span>
            </button>
            <button class="settings-tab" onclick="switchTab('cat2')">
              <i class="fas fa-folder-tree"></i> Category 2
              <span class="tab-count" id="count-cat2">0</span>
            </button>
          </div>

          <!-- ═══ CHOOSE OPTIONS ═══ -->
          <div class="settings-section active" id="sec-choose">
            <div class="add-bar">
              <input id="add-choose-name" placeholder="Option name…" onkeydown="if(event.key==='Enter')addChoose()">
              <select id="add-choose-type">
                <option value="project">Project</option>
                <option value="other">Other</option>
              </select>
              <button class="btn btn-primary btn-sm" onclick="addChoose()"><i class="fas fa-plus"></i> Add</button>
            </div>
            <div id="choose-list"><div class="loading-wrap"><div class="spinner"></div></div></div>
          </div>

          <!-- ═══ CATEGORY 1 ═══ -->
          <div class="settings-section" id="sec-cat1">
            <div class="add-bar">
              <input id="add-cat1-name" placeholder="Category 1 name…" onkeydown="if(event.key==='Enter')addCat1()">
              <button class="btn btn-primary btn-sm" onclick="addCat1()"><i class="fas fa-plus"></i> Add</button>
            </div>
            <div id="cat1-list"><div class="loading-wrap"><div class="spinner"></div></div></div>
          </div>

          <!-- ═══ CATEGORY 2 ═══ -->
          <div class="settings-section" id="sec-cat2">
            <div class="parent-picker">
              <span class="parent-picker-label"><i class="fas fa-folder"></i> Working in:</span>
              <select id="cat2-parent" onchange="onCat2ParentChange()">
                <option value="">Select Category 1 first…</option>
              </select>
            </div>

            <div id="cat2-add-area" style="display:none;">
              <div class="add-bar" style="margin-bottom:8px;">
                <input id="add-cat2-name" placeholder="Type name and press Enter…" onkeydown="if(event.key==='Enter')addCat2()">
                <button class="btn btn-primary btn-sm" onclick="addCat2()"><i class="fas fa-plus"></i> Add</button>
                <button class="btn btn-ghost btn-sm" onclick="toggleBulk()" title="Bulk add"><i class="fas fa-list-ul"></i> Bulk</button>
                <button class="btn btn-ghost btn-sm" onclick="togglePick()" title="Reuse existing"><i class="fas fa-clone"></i> Pick</button>
              </div>

              <!-- Bulk add -->
              <div id="cat2-bulk-area" style="display:none;">
                <div class="expand-panel">
                  <div class="expand-panel-title">Paste multiple names — one per line</div>
                  <textarea id="cat2-bulk" class="form-input" rows="5" placeholder="Sales Lead&#10;Events&#10;EOI Refund&#10;Data Update" style="font-size:13px;width:100%;"></textarea>
                  <button class="btn btn-primary btn-sm" style="margin-top:10px;" onclick="bulkAddCat2()"><i class="fas fa-layer-group"></i> Add All</button>
                </div>
              </div>

              <!-- Pick existing -->
              <div id="cat2-pick-area" style="display:none;">
                <div class="expand-panel">
                  <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap;">
                    <div class="expand-panel-title" style="margin:0;">Reuse sub-categories from other Category 1</div>
                    <input id="cat2-pick-filter" placeholder="Filter…" class="form-input" style="width:180px;padding:6px 10px;font-size:12px;" oninput="renderPickList()">
                  </div>
                  <div id="cat2-pick-list" style="max-height:260px;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:4px;">
                    <div class="loading-wrap"><div class="spinner"></div></div>
                  </div>
                  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px;flex-wrap:wrap;">
                    <span id="cat2-pick-count" style="font-size:11px;color:var(--muted);font-weight:700;">0 selected</span>
                    <div style="display:flex;gap:8px;">
                      <button class="btn btn-ghost btn-sm" onclick="clearPickSelection()"><i class="fas fa-times"></i> Clear</button>
                      <button class="btn btn-primary btn-sm" onclick="addSelectedExistingCat2()"><i class="fas fa-plus-circle"></i> Add selected</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div id="cat2-list"><div class="empty-state"><span class="empty-icon">👆</span>Select a Category 1 above to manage its sub-categories</div></div>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>

<!-- ═══ SHARED UI ═══ -->
<div id="toast-container"></div>
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">Confirm</div>
      <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-msg" id="modal-msg"></div>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-danger" id="modal-confirm">Confirm</button>
    </div>
  </div>
</div>

<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script>
renderSidebar();
applyThemeIcon();
const session = checkAuth();
if (session) {
  document.getElementById('admin-name').innerText  = session.username || 'Admin';
  document.getElementById('admin-avatar').innerText = initials(session.username || 'Admin');
}

let cat1Cache = [];

// ── TAB SWITCHING ──
function switchTab(tab) {
  const tabs = ['choose','cat1','cat2'];
  document.querySelectorAll('.settings-tab').forEach((t,i) => {
    t.classList.toggle('active', tabs[i] === tab);
  });
  document.querySelectorAll('.settings-section').forEach(s => s.classList.remove('active'));
  document.getElementById('sec-' + tab).classList.add('active');
}

// ── RENDER HELPERS ──
function toggleBtn(isActive, id, table) {
  const cls  = isActive ? 'toggle-on' : 'toggle-off';
  const icon = isActive ? 'fa-toggle-on' : 'fa-toggle-off';
  const tip  = isActive ? 'Active — click to deactivate' : 'Inactive — click to activate';
  return `<button class="action-btn ${cls}" title="${tip}" onclick="toggleActive('${table}','${id}',${!isActive})"><i class="fas ${icon}"></i></button>`;
}
function deleteBtn(id, table, name) {
  return `<button class="action-btn danger" title="Delete" onclick="deleteItem('${table}','${id}','${escapeHtml(name)}')"><i class="fas fa-trash"></i></button>`;
}
function editBtn(id, table, name) {
  return `<button class="action-btn" title="Rename" onclick="renameItem('${table}','${id}','${escapeHtml(name)}')"><i class="fas fa-pen"></i></button>`;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ══════════════════════════
// CHOOSE OPTIONS
// ══════════════════════════
async function loadChoose() {
  const wrap = document.getElementById('choose-list');
  wrap.innerHTML = '<div class="loading-wrap"><div class="spinner"></div></div>';
  const { data, error } = await db.from('call_log_choose_options').select('*').order('sort_order').order('name');
  if (error) { wrap.innerHTML = `<div class="empty-state">❌ ${error.message}</div>`; return; }

  document.getElementById('count-choose').textContent = data?.length || 0;

  if (!data?.length) { wrap.innerHTML = '<div class="empty-state"><span class="empty-icon">📭</span>No options yet — add one above</div>'; return; }

  wrap.innerHTML = '<div class="item-list">' + data.map(r => `
    <div class="item-row ${r.is_active ? '' : 'inactive'}">
      <span class="item-type-badge ${r.option_type === 'project' ? 'type-project' : 'type-other'}">${r.option_type}</span>
      <span class="item-name">${escapeHtml(r.name)}</span>
      <div class="item-actions">
        ${editBtn(r.id, 'call_log_choose_options', r.name)}
        ${toggleBtn(r.is_active, r.id, 'call_log_choose_options')}
        ${deleteBtn(r.id, 'call_log_choose_options', r.name)}
      </div>
    </div>`).join('') + '</div>';
}

async function addChoose() {
  const input = document.getElementById('add-choose-name');
  const name  = input.value.trim();
  const type  = document.getElementById('add-choose-type').value;
  if (!name) { showToast('Enter a name', 'warning'); return; }
  const { error } = await db.from('call_log_choose_options').insert({ name, option_type: type });
  if (error) { showToast(error.message, 'error'); return; }
  input.value = '';
  input.focus();
  showToast(`"${name}" added`, 'success');
  loadChoose();
}

// ══════════════════════════
// CATEGORY 1
// ══════════════════════════
async function loadCat1() {
  const wrap = document.getElementById('cat1-list');
  wrap.innerHTML = '<div class="loading-wrap"><div class="spinner"></div></div>';
  const { data, error } = await db.from('call_log_categories').select('*').order('sort_order').order('name');
  if (error) { wrap.innerHTML = `<div class="empty-state">❌ ${error.message}</div>`; return; }
  cat1Cache = data || [];

  document.getElementById('count-cat1').textContent = data?.length || 0;

  // Populate Cat2 parent dropdown
  const sel = document.getElementById('cat2-parent');
  const val = sel.value;
  sel.innerHTML = '<option value="">Select Category 1 first…</option>';
  cat1Cache.filter(c => c.is_active).forEach(c => sel.add(new Option(c.name, c.id)));
  sel.value = val;

  if (!data?.length) { wrap.innerHTML = '<div class="empty-state"><span class="empty-icon">📭</span>No categories yet — add one above</div>'; return; }

  wrap.innerHTML = '<div class="item-list">' + data.map(r => `
    <div class="item-row ${r.is_active ? '' : 'inactive'}">
      <span class="item-name">${escapeHtml(r.name)}</span>
      <div class="item-actions">
        ${editBtn(r.id, 'call_log_categories', r.name)}
        ${toggleBtn(r.is_active, r.id, 'call_log_categories')}
        ${deleteBtn(r.id, 'call_log_categories', r.name)}
      </div>
    </div>`).join('') + '</div>';
}

async function addCat1() {
  const input = document.getElementById('add-cat1-name');
  const name  = input.value.trim();
  if (!name) { showToast('Enter a name', 'warning'); return; }
  const { error } = await db.from('call_log_categories').insert({ name });
  if (error) { showToast(error.message, 'error'); return; }
  input.value = '';
  input.focus();
  showToast(`"${name}" added`, 'success');
  loadCat1();
}

// ══════════════════════════
// CATEGORY 2
// ══════════════════════════
function onCat2ParentChange() {
  const parentId = document.getElementById('cat2-parent').value;
  document.getElementById('cat2-add-area').style.display = parentId ? '' : 'none';
  document.getElementById('cat2-bulk-area').style.display = 'none';
  document.getElementById('cat2-pick-area').style.display = 'none';
  if (parentId) {
    loadCat2();
    setTimeout(() => document.getElementById('add-cat2-name').focus(), 100);
  } else {
    document.getElementById('cat2-list').innerHTML = '<div class="empty-state"><span class="empty-icon">👆</span>Select a Category 1 above to manage its sub-categories</div>';
    document.getElementById('count-cat2').textContent = 0;
  }
}

function toggleBulk() {
  const area = document.getElementById('cat2-bulk-area');
  const opening = area.style.display === 'none';
  if (opening) document.getElementById('cat2-pick-area').style.display = 'none';
  area.style.display = opening ? '' : 'none';
}

let _allCat2Cache = [];

function togglePick() {
  const area = document.getElementById('cat2-pick-area');
  const opening = area.style.display === 'none';
  if (opening) document.getElementById('cat2-bulk-area').style.display = 'none';
  area.style.display = opening ? '' : 'none';
  if (opening) loadPickList();
}

async function loadPickList() {
  const listEl = document.getElementById('cat2-pick-list');
  listEl.innerHTML = '<div class="loading-wrap"><div class="spinner"></div></div>';
  const { data, error } = await db.from('call_log_category2').select('id, category1_id, name').order('name');
  if (error) { listEl.innerHTML = `<div class="empty-state" style="padding:20px;">❌ ${error.message}</div>`; return; }
  _allCat2Cache = data || [];
  renderPickList();
}

function renderPickList() {
  const listEl = document.getElementById('cat2-pick-list');
  const filter = (document.getElementById('cat2-pick-filter').value || '').trim().toLowerCase();
  const currentParent = document.getElementById('cat2-parent').value;

  const byName = {};
  for (const row of _allCat2Cache) {
    const key = row.name.toLowerCase();
    if (!byName[key]) byName[key] = { name: row.name, parents: new Set() };
    byName[key].parents.add(row.category1_id);
  }

  const items = Object.values(byName)
    .map(x => {
      const parentNames = [...x.parents]
        .map(pid => cat1Cache.find(c => c.id === pid)?.name || '?')
        .sort((a, b) => a.localeCompare(b));
      return { name: x.name, parentNames, alreadyHere: x.parents.has(currentParent) };
    })
    .filter(x => !x.alreadyHere)
    .filter(x => !filter || x.name.toLowerCase().includes(filter))
    .sort((a, b) => a.name.localeCompare(b.name));

  if (!items.length) {
    listEl.innerHTML = '<div class="empty-state" style="padding:20px;font-size:12px;"><span class="empty-icon">📭</span>No sub-categories available to reuse</div>';
    updatePickCount();
    return;
  }

  listEl.innerHTML = items.map(item => `
    <label class="pick-item">
      <input type="checkbox" class="cat2-pick-cb" data-name="${escapeHtml(item.name)}" onchange="updatePickCount()" style="width:16px;height:16px;cursor:pointer;flex-shrink:0;accent-color:var(--accent);">
      <span class="pick-name">${escapeHtml(item.name)}</span>
      <span class="pick-parents">in: ${item.parentNames.map(escapeHtml).join(', ')}</span>
    </label>
  `).join('');
  updatePickCount();
}

function updatePickCount() {
  const n = document.querySelectorAll('.cat2-pick-cb:checked').length;
  document.getElementById('cat2-pick-count').innerText = `${n} selected`;
}

function clearPickSelection() {
  document.querySelectorAll('.cat2-pick-cb:checked').forEach(cb => cb.checked = false);
  updatePickCount();
}

async function addSelectedExistingCat2() {
  const parentId = document.getElementById('cat2-parent').value;
  if (!parentId) { showToast('Select Category 1 first', 'warning'); return; }
  const names = [...document.querySelectorAll('.cat2-pick-cb:checked')].map(cb => cb.dataset.name);
  if (!names.length) { showToast('Pick at least one item', 'warning'); return; }

  const rows = names.map(name => ({ category1_id: parentId, name }));
  const { error } = await db.from('call_log_category2').insert(rows);
  if (error) { showToast(error.message, 'error'); return; }

  document.getElementById('cat2-pick-area').style.display = 'none';
  showToast(`Added ${names.length} item(s)`, 'success');
  loadCat2();
}

async function loadCat2() {
  const wrap   = document.getElementById('cat2-list');
  const parent = document.getElementById('cat2-parent').value;
  if (!parent) return;
  wrap.innerHTML = '<div class="loading-wrap"><div class="spinner"></div></div>';

  const { data, error } = await db.from('call_log_category2').select('*').eq('category1_id', parent).order('sort_order').order('name');
  if (error) { wrap.innerHTML = `<div class="empty-state">❌ ${error.message}</div>`; return; }

  document.getElementById('count-cat2').textContent = data?.length || 0;

  if (!data?.length) { wrap.innerHTML = '<div class="empty-state"><span class="empty-icon">📭</span>No sub-categories yet — add some above</div>'; return; }

  const parentName = cat1Cache.find(c => c.id === parent)?.name || '?';

  wrap.innerHTML = `<div class="section-count">${data.length} item(s) under ${escapeHtml(parentName)}</div>` +
    '<div class="item-list">' + data.map(r => `
    <div class="item-row ${r.is_active ? '' : 'inactive'}">
      <span class="item-name">${escapeHtml(r.name)}</span>
      <div class="item-actions">
        ${editBtn(r.id, 'call_log_category2', r.name)}
        ${toggleBtn(r.is_active, r.id, 'call_log_category2')}
        ${deleteBtn(r.id, 'call_log_category2', r.name)}
      </div>
    </div>`).join('') + '</div>';
}

async function addCat2() {
  const parentId = document.getElementById('cat2-parent').value;
  const input    = document.getElementById('add-cat2-name');
  const name     = input.value.trim();
  if (!parentId) { showToast('Select Category 1 first', 'warning'); return; }
  if (!name)     { showToast('Enter a name', 'warning'); return; }
  const { error } = await db.from('call_log_category2').insert({ category1_id: parentId, name });
  if (error) { showToast(error.message, 'error'); return; }
  input.value = '';
  input.focus();
  showToast(`"${name}" added`, 'success');
  loadCat2();
}

async function bulkAddCat2() {
  const parentId = document.getElementById('cat2-parent').value;
  const raw      = document.getElementById('cat2-bulk').value.trim();
  if (!parentId) { showToast('Select Category 1 first', 'warning'); return; }
  if (!raw)      { showToast('Paste names — one per line', 'warning'); return; }

  const names = raw.split('\n').map(n => n.trim()).filter(Boolean);
  if (!names.length) { showToast('No valid names found', 'warning'); return; }

  const rows = names.map(name => ({ category1_id: parentId, name }));
  const { error } = await db.from('call_log_category2').insert(rows);
  if (error) { showToast(error.message, 'error'); return; }

  document.getElementById('cat2-bulk').value = '';
  document.getElementById('cat2-bulk-area').style.display = 'none';
  showToast(`Added ${names.length} items`, 'success');
  loadCat2();
}

// ══════════════════════════
// SHARED ACTIONS
// ══════════════════════════
async function toggleActive(table, id, newState) {
  const { error } = await db.from(table).update({ is_active: newState, updated_at: new Date().toISOString() }).eq('id', id);
  if (error) { showToast(error.message, 'error'); return; }
  showToast(newState ? 'Activated' : 'Deactivated', 'success');
  refreshAll();
}

function deleteItem(table, id, name) {
  openModal('Delete', `Delete "${name}"? This cannot be undone.`, async () => {
    const { error } = await db.from(table).delete().eq('id', id);
    if (error) { showToast(error.message, 'error'); return; }
    showToast('Deleted', 'success');
    refreshAll();
  });
}

async function renameItem(table, id, currentName) {
  const newName = await showPrompt('Rename', currentName, 'Enter the new name for this item');
  if (!newName || newName === currentName) return;
  const { error } = await db.from(table).update({ name: newName, updated_at: new Date().toISOString() }).eq('id', id);
  if (error) { showToast(error.message, 'error'); return; }
  showToast('Renamed', 'success');
  refreshAll();
}

function refreshAll() {
  loadChoose();
  loadCat1();
  const parent = document.getElementById('cat2-parent').value;
  if (parent) loadCat2();
}

// ── INIT ──
refreshAll();
</script>
